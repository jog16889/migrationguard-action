name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risky-fixture-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: mg
        uses: ./
        continue-on-error: true
        with:
          paths: test
      - run: test "${{ steps.mg.outcome }}" = "failure"
