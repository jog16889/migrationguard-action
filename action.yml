name: MigrationGuard
description: Review SQL migrations changed in a pull request for data loss, locking and rolling-deploy risks.
author: TechnofyStore
branding:
  icon: shield
  color: green

inputs:
  version:
    description: MigrationGuard CLI version to download.
    default: "1.4.1"
  cli-url:
    description: Where to download the CLI jar. `{version}` is replaced with the version input.
    default: "https://technofystore-legal.jog16889.workers.dev/cli/migrationguard-cli-{version}.jar"
  base:
    description: Git ref to compare against. Defaults to the pull request base branch; empty on push checks every SQL file.
    default: ""
  paths:
    description: Space-separated files or directories to check (default the whole repository).
    default: "."
  fail-on:
    description: critical, high, medium, low, info or none.
    default: high
  sarif:
    description: Also write migrationguard.sarif and upload it to GitHub code scanning.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Download MigrationGuard CLI
      shell: bash
      env:
        MG_URL: ${{ inputs.cli-url }}
        MG_VERSION: ${{ inputs.version }}
      run: |
        url="${MG_URL//\{version\}/$MG_VERSION}"
        curl -fsSL "$url" -o "$RUNNER_TEMP/migrationguard-cli.jar"
        # Verify the published checksum when the server provides one next to the jar.
        if curl -fsSL "$url.sha256" -o "$RUNNER_TEMP/migrationguard-cli.sha256" 2>/dev/null; then
          expected="$(cut -d' ' -f1 "$RUNNER_TEMP/migrationguard-cli.sha256")"
          actual="$(sha256sum "$RUNNER_TEMP/migrationguard-cli.jar" | cut -d' ' -f1)"
          [ "$expected" = "$actual" ] || { echo "::error::MigrationGuard CLI checksum mismatch"; exit 1; }
        fi

    - name: Review migrations
      shell: bash
      env:
        MG_BASE: ${{ inputs.base }}
        MG_PATHS: ${{ inputs.paths }}
        MG_FAIL_ON: ${{ inputs.fail-on }}
        MG_SARIF: ${{ inputs.sarif }}
        PR_BASE: ${{ github.base_ref }}
      run: |
        base="$MG_BASE"
        if [ -z "$base" ] && [ -n "$PR_BASE" ]; then
          git fetch --no-tags --depth=200 origin "$PR_BASE" >/dev/null 2>&1 || true
          base="origin/$PR_BASE"
        fi
        args=(check $MG_PATHS --fail-on "$MG_FAIL_ON")
        [ -n "$base" ] && args+=(--base "$base")
        status=0
        java -jar "$RUNNER_TEMP/migrationguard-cli.jar" "${args[@]}" --format github || status=$?
        if [ "$MG_SARIF" = "true" ]; then
          java -jar "$RUNNER_TEMP/migrationguard-cli.jar" "${args[@]}" --fail-on none --format sarif --output migrationguard.sarif
        fi
        exit $status

    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: migrationguard.sarif
        category: migrationguard
